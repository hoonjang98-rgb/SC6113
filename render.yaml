services:
  - type: web
    runtime: static
    name: sc6113-simple-storage
    rootDir: simple-storage
    buildCommand: echo "SimpleStorage static site is ready"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
