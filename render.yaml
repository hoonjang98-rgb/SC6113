services:
  - type: web
    runtime: static
    name: pocketpay-sepolia
    rootDir: pocketpay
    buildCommand: echo "PocketPay static site is ready"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
